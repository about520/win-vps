name: win-vps

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win-vps
  cancel-in-progress: false

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 机器信息
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
          Get-PSDrive C | Select-Object Used,Free | Format-List

      - name: 开 RDP + 双隧道并回写地址
        shell: pwsh
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $pw = 'GitHub@2024!vps'

          Write-Output '=== 1. 设置账户与远程桌面 ==='
          net user runneradmin $pw 2>&1 | Out-String | Write-Output
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService -ErrorAction SilentlyContinue
          Get-Service TermService | Select-Object Name,Status | Format-List

          Write-Output '=== 2. bore 隧道 ==='
          $boreAddr = $null
          try {
            $zip = Join-Path $env:TEMP 'bore.zip'
            Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-pc-windows-msvc.zip' -OutFile $zip -UseBasicParsing -TimeoutSec 120
            Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP 'bore') -Force
            $be = Join-Path $env:TEMP 'bore.bore.err'
            Start-Process -FilePath (Join-Path $env:TEMP 'bore\bore.exe') -ArgumentList 'local','3389','--to','bore.pub' -RedirectStandardError $be -RedirectStandardOutput (Join-Path $env:TEMP 'bore.bore.out') -NoNewWindow
            Start-Sleep -Seconds 20
            $bt = (Get-Content $be -Raw -ErrorAction SilentlyContinue)
            Write-Output $bt
            $m = [regex]::Match([string]$bt, 'bore\.pub:(\d+)')
            if ($m.Success) { $boreAddr = 'bore.pub:' + $m.Groups[1].Value }
          } catch { Write-Output ('bore 失败: ' + $_) }
          Write-Output ('bore 地址 = ' + $boreAddr)

          Write-Output '=== 3. serveo 隧道 ==='
          $srvAddr = $null
          try {
            $se = Join-Path $env:TEMP 'serveo.err'
            Start-Process -FilePath 'ssh.exe' -ArgumentList '-o','StrictHostKeyChecking=no','-o','UserKnownHostsFile=NUL','-o','ServerAliveInterval=30','-R','0:localhost:3389','serveo.net' -RedirectStandardError $se -RedirectStandardOutput (Join-Path $env:TEMP 'serveo.out') -NoNewWindow
            Start-Sleep -Seconds 25
            $st = (Get-Content $se -Raw -ErrorAction SilentlyContinue)
            Write-Output $st
            $m2 = [regex]::Match([string]$st, 'serveo\.net:(\d+)')
            if ($m2.Success) { $srvAddr = 'serveo.net:' + $m2.Groups[1].Value }
          } catch { Write-Output ('serveo 失败: ' + $_) }
          Write-Output ('serveo 地址 = ' + $srvAddr)

          Write-Output '=== 4. 回写 status.md ==='
          $lines = @(
            '# Windows 白嫖机',
            '',
            '- 用户名: .\runneradmin',
            '- 密码: ' + $pw,
            '- RDP 地址 A (bore): ' + $boreAddr,
            '- RDP 地址 B (serveo): ' + $srvAddr,
            '- 系统: ' + (Get-CimInstance Win32_OperatingSystem).Caption,
            '- 时间: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'
          )
          $body = $lines -join "`n"

          $api = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/status.md'
          $h = @{ Authorization = 'token ' + $env:GH_TOKEN; 'User-Agent' = 'gh-actions'; Accept = 'application/vnd.github+json' }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          try {
            $ex = Invoke-RestMethod -Uri $api -Headers $h -ErrorAction Stop
            $payload = @{ message = 'ci: RDP 地址'; content = $b64; sha = $ex.sha; branch = 'main' } | ConvertTo-Json -Compress
          } catch {
            $payload = @{ message = 'ci: RDP 地址'; content = $b64; branch = 'main' } | ConvertTo-Json -Compress
          }
          try {
            Invoke-RestMethod -Uri $api -Method Put -Headers $h -Body $payload -ContentType 'application/json; charset=utf-8' | Out-Null
            Write-Output 'status.md 已回写'
          } catch {
            Write-Output ('回写失败: ' + $_)
          }

          if ($boreAddr) { Write-Output ('::notice title=RDP-bore::mstsc /v:' + $boreAddr) }
          if ($srvAddr)  { Write-Output ('::notice title=RDP-serveo::mstsc /v:' + $srvAddr) }

          Write-Output '=== 5. 保持会话 ==='
          while ($true) {
            Start-Sleep -Seconds 120
            Write-Output ('alive ' + (Get-Date).ToUniversalTime().ToString('HH:mm:ss'))
          }
