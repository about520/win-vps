name: win-vps

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win-vps
  cancel-in-progress: false

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 机器信息
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List

      - name: 开 RDP + bore 隧道（自动重连）
        shell: pwsh
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $pw = 'GitHub@2024!vps'

          Write-Host '=== 1. 账户与远程桌面 ==='
          net user runneradmin $pw 2>&1 | Out-String | Write-Host
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService -ErrorAction SilentlyContinue
          Write-Host ('TermService = ' + (Get-Service TermService).Status)

          Write-Host '=== 2. 下载 bore ==='
          $dir = Join-Path $env:TEMP 'bore'
          $zip = Join-Path $env:TEMP 'bore.zip'
          Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-pc-windows-msvc.zip' -OutFile $zip -UseBasicParsing -TimeoutSec 180
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $boreExe = (Get-ChildItem -Path $dir -Recurse -Filter 'bore.exe' | Select-Object -First 1).FullName
          Write-Host ('bore.exe = ' + $boreExe)
          if (-not $boreExe) { throw 'bore.exe 没找到' }

          function Push-Status([string]$addr) {
            $lines = @(
              '# Windows 白嫖机',
              '',
              '- RDP 地址: ' + $addr,
              '- 用户名: .\runneradmin',
              '- 密码: ' + $pw,
              '- 系统: Windows Server 2025 Datacenter',
              '- 时间: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'
            )
            $body = $lines -join "`n"
            $api = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/status.md'
            $h = @{ Authorization = 'token ' + $env:GH_TOKEN; 'User-Agent' = 'gh'; Accept = 'application/vnd.github+json' }
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
            try {
              $ex = Invoke-RestMethod -Uri $api -Headers $h -ErrorAction Stop
              $p = @{ message = 'ci: rdp'; content = $b64; sha = $ex.sha; branch = 'main' } | ConvertTo-Json -Compress
            } catch {
              $p = @{ message = 'ci: rdp'; content = $b64; branch = 'main' } | ConvertTo-Json -Compress
            }
            try {
              Invoke-RestMethod -Uri $api -Method Put -Headers $h -Body $p -ContentType 'application/json; charset=utf-8' | Out-Null
              Write-Host ('status.md <- ' + $addr)
            } catch {
              Write-Host ('回写失败: ' + $_)
            }
          }

          function Start-Bore {
            Get-Process bore -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $o = Join-Path $env:TEMP 'bore.out'
            $e = Join-Path $env:TEMP 'bore.err'
            Remove-Item $o,$e -ErrorAction SilentlyContinue
            Start-Process -FilePath $boreExe -ArgumentList 'local','3389','--to','bore.pub' -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow
            $addr = ''
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 3
              $t = [string](Get-Content $o -Raw -ErrorAction SilentlyContinue) + [string](Get-Content $e -Raw -ErrorAction SilentlyContinue)
              $m = [regex]::Match($t, 'listening at bore\.pub:(\d+)')
              if ($m.Success) { $addr = 'bore.pub:' + $m.Groups[1].Value; break }
            }
            if (-not $addr) {
              Write-Host ('bore 原始输出: ' + [string](Get-Content $e -Raw -ErrorAction SilentlyContinue))
            }
            Write-Host ('Start-Bore 结果 = ' + $addr)
            return $addr
          }

          Write-Host '=== 3. 建立隧道 ==='
          $addr = (Start-Bore | Select-Object -Last 1)
          $last = $addr
          if ($addr) {
            Push-Status $addr
            Write-Output ('::notice title=RDP::mstsc /v:' + $addr)
          }

          Write-Host '=== 4. 保活 + 断线重连 ==='
          while ($true) {
            Start-Sleep -Seconds 60
            $proc = Get-Process bore -ErrorAction SilentlyContinue
            if (-not $proc) {
              Write-Host 'bore 进程消失，重连中...'
              $addr = (Start-Bore | Select-Object -Last 1)
              if ($addr -and $addr -ne $last) {
                $last = $addr
                Push-Status $addr
                Write-Output ('::notice title=RDP::mstsc /v:' + $addr)
              }
            }
            Write-Host ('alive ' + (Get-Date).ToUniversalTime().ToString('HH:mm:ss') + '  addr=' + $last)
          }
