name: win-vps

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win-vps
  cancel-in-progress: false

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 准备环境
        shell: pwsh
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.DirectoryServices.AccountManagement

          function Test-Pw([string]$user, [string]$pass) {
            try {
              $ctx = New-Object System.DirectoryServices.AccountManagement.PrincipalContext('Machine')
              return $ctx.ValidateCredentials($user, $pass)
            } catch { return $false }
          }

          Write-Host '=== 1. 设置密码 ==='
          $cands = @('Runner2024', 'Runner2024!', 'Gh2024vps')
          $pw = $null
          foreach ($c in $cands) {
            try {
              $sec = ConvertTo-SecureString $c -AsPlainText -Force
              Set-LocalUser -Name 'runneradmin' -Password $sec -ErrorAction Stop
              Start-Sleep -Seconds 2
              if (Test-Pw 'runneradmin' $c) { $pw = $c; Write-Host ('  OK ' + $c); break }
            } catch { Write-Host ('  fail ' + $c + ': ' + $_) }
          }
          if (-not $pw) { $pw = 'Runner2024' }
          Enable-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue
          Set-LocalUser -Name 'runneradmin' -PasswordNeverExpires $true -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'runneradmin' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member 'runneradmin' -ErrorAction SilentlyContinue

          Write-Host '=== 2. 开远程桌面 ==='
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          $rdp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $rdp -Name 'UserAuthentication' -Value 0
          $tsPol = 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services'
          New-Item -Path $tsPol -Force | Out-Null
          New-ItemProperty -Path $tsPol -Name 'fDisableUdp' -PropertyType DWord -Value 1 -Force | Out-Null
          Set-ItemProperty -Path $rdp -Name 'SecurityLayer' -Value 0
          Set-ItemProperty -Path $rdp -Name 'MinEncryptionLevel' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service TermService -ErrorAction SilentlyContinue
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $ts = (Get-Service TermService).Status
          $hostname = $env:COMPUTERNAME
          Write-Host ('  TermService=' + $ts + '  主机=' + $hostname)

          Write-Host '=== 3. 下载 cloudflared ==='
          $cf = Join-Path $env:TEMP 'cloudflared.exe'
          try {
            Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile $cf -UseBasicParsing -TimeoutSec 300
            Write-Host ('  cloudflared ' + [math]::Round((Get-Item $cf).Length/1MB,1) + ' MB')
          } catch { Write-Host ('  下载失败: ' + $_) }

          Write-Host '=== 4. 下载 bore（备用）==='
          $boreExe = $null
          try {
            $dir = Join-Path $env:TEMP 'bore'
            Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-pc-windows-msvc.zip' -OutFile "$env:TEMP\bore.zip" -UseBasicParsing -TimeoutSec 180
            Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath $dir -Force
            $boreExe = (Get-ChildItem -Path $dir -Recurse -Filter 'bore.exe' | Select-Object -First 1).FullName
          } catch { Write-Host ('  bore 下载失败: ' + $_) }

          function Push-Status([string]$cfAddr, [string]$boreAddr) {
            $lines = @(
              '# Windows 白嫖机',
              '',
              '## 方案 A: Cloudflare 隧道（推荐，国内连通性好）',
              '',
              '- 地址: ' + $cfAddr,
              '',
              '## 方案 B: bore 隧道（备用）',
              '',
              '- 地址: ' + $boreAddr,
              '',
              '## 凭据',
              '',
              '- 用户名: ' + $hostname + '\runneradmin',
              '- 用户名(简写): .\runneradmin',
              '- 密码: ' + $pw,
              '- 密码实测: ' + $(if (Test-Pw 'runneradmin' $pw) { '通过' } else { '未知' }),
              '- 系统: Windows Server 2025 Datacenter',
              '- RDP: ' + $ts + ' (TCP only)',
              '- 时间: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'
            )
            $body = $lines -join "`n"
            $api = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/status.md'
            $h = @{ Authorization = 'token ' + $env:GH_TOKEN; 'User-Agent' = 'gh'; Accept = 'application/vnd.github+json' }
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
            try {
              $ex = Invoke-RestMethod -Uri $api -Headers $h -ErrorAction Stop
              $p = @{ message = 'ci: conn'; content = $b64; sha = $ex.sha; branch = 'main' } | ConvertTo-Json -Compress
            } catch {
              $p = @{ message = 'ci: conn'; content = $b64; branch = 'main' } | ConvertTo-Json -Compress
            }
            try {
              Invoke-RestMethod -Uri $api -Method Put -Headers $h -Body $p -ContentType 'application/json; charset=utf-8' | Out-Null
              Write-Host ('  status.md <- cf=' + $cfAddr + ' bore=' + $boreAddr)
            } catch { Write-Host ('  回写失败: ' + $_) }
          }

          Write-Host '=== 5. 启动 Cloudflare 隧道 ==='
          $cfAddr = ''
          $cfLog = Join-Path $env:TEMP 'cf.err'
          if (Test-Path $cf) {
            Remove-Item $cfLog -ErrorAction SilentlyContinue
            Start-Process -FilePath $cf -ArgumentList 'tunnel','--url','rdp://localhost:3389','--no-autoupdate','--no-tls-verify' -RedirectStandardError $cfLog -RedirectStandardOutput (Join-Path $env:TEMP 'cf.out') -NoNewWindow
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 3
              $t = [string](Get-Content $cfLog -Raw -ErrorAction SilentlyContinue)
              $m = [regex]::Match($t, '([a-z0-9-]+\.trycloudflare\.com)')
              if ($m.Success) { $cfAddr = $m.Groups[1].Value; break }
            }
            Write-Host ('  cloudflared 原始输出:')
            Get-Content $cfLog -ErrorAction SilentlyContinue | Select-Object -Last 15 | ForEach-Object { Write-Host ('    ' + $_) }
          }
          Write-Host ('  Cloudflare 地址 = ' + $cfAddr)

          Write-Host '=== 6. 启动 bore 备用隧道 ==='
          $boreAddr = ''
          if ($boreExe) {
            $o = Join-Path $env:TEMP 'bore.out'
            $e = Join-Path $env:TEMP 'bore.err'
            Start-Process -FilePath $boreExe -ArgumentList 'local','3389','--to','bore.pub' -RedirectStandardOutput $o -RedirectStandardError $e -NoNewWindow
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 3
              $t = [string](Get-Content $o -Raw -ErrorAction SilentlyContinue) + [string](Get-Content $e -Raw -ErrorAction SilentlyContinue)
              $m = [regex]::Match($t, 'listening at bore\.pub:(\d+)')
              if ($m.Success) { $boreAddr = 'bore.pub:' + $m.Groups[1].Value; break }
            }
          }
          Write-Host ('  bore 地址 = ' + $boreAddr)

          Write-Host '=== 7. 回写 ==='
          if ($cfAddr -or $boreAddr) { Push-Status $cfAddr $boreAddr }
          if ($cfAddr) { Write-Output ('::notice title=Cloudflare::' + $cfAddr) }
          if ($boreAddr) { Write-Output ('::notice title=bore::' + $boreAddr) }

          Write-Host '=== 8. 保活 ==='
          while ($true) {
            Start-Sleep -Seconds 60
            Write-Host ('alive ' + (Get-Date).ToUniversalTime().ToString('HH:mm:ss') + '  cf=' + $cfAddr + ' bore=' + $boreAddr)
          }
