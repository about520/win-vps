name: win-vps

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win-vps
  cancel-in-progress: false

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: 机器信息
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,TotalVisibleMemorySize | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors | Format-List
          Get-PSDrive C | Select-Object Used,Free | Format-List
          Write-Output "runner=${{ runner.name }} os=${{ runner.os }} arch=${{ runner.arch }}"

      - name: 装 tmate 抓地址并保活
        shell: pwsh
        timeout-minutes: 350
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $msys = 'C:\msys64'
          $bash = Join-Path $msys 'usr\bin\bash.exe'
          $pac  = Join-Path $msys 'usr\bin\pacman.exe'
          $log  = Join-Path $msys 'tmp\tmate.log'

          Write-Output '--- 安装 tmate ---'
          & $pac -Sy --noconfirm --needed tmate 2>&1 | Select-Object -Last 6

          Remove-Item $log -ErrorAction SilentlyContinue
          Write-Output '--- 启动 tmate ---'
          $arg = '"tmate -F > /tmp/tmate.log 2>&1"'
          Start-Process -FilePath $bash -ArgumentList '-lc', $arg -NoNewWindow

          $sshUrl = $null
          $webUrl = $null
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 3
            if (-not (Test-Path $log)) { continue }
            $t = Get-Content $log -Raw -ErrorAction SilentlyContinue
            if (-not $t) { continue }
            $m1 = [regex]::Match($t, 'ssh\s+([A-Za-z0-9]+@[A-Za-z0-9.\-]*tmate[A-Za-z0-9.\-]*)')
            $m2 = [regex]::Match($t, 'https?://tmate\.io/t/[A-Za-z0-9]+')
            if ($m1.Success) { $sshUrl = $m1.Groups[1].Value }
            if ($m2.Success) { $webUrl = $m2.Value }
            if ($sshUrl) { break }
          }

          Write-Output '--- tmate 输出 ---'
          Get-Content $log -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_ }
          Write-Output '--- 解析结果 ---'
          Write-Output "SSH=$sshUrl"
          Write-Output "WEB=$webUrl"

          if ($sshUrl) { Write-Output "::notice title=SSH::$sshUrl" }
          if ($webUrl) { Write-Output "::notice title=Web::$webUrl" }

          $lines = @(
            '# Windows 白嫖机',
            '',
            '- SSH: ' + $sshUrl,
            '- Web: ' + $webUrl,
            '- OS: ' + (Get-CimInstance Win32_OperatingSystem).Caption,
            '- 时间: ' + (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss') + ' UTC'
          )
          $body = $lines -join "`n"

          $api = 'https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/status.md'
          $h = @{ Authorization = 'token ' + $env:GH_TOKEN; 'User-Agent' = 'gh-actions'; Accept = 'application/vnd.github+json' }
          $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($body))
          try {
            $ex = Invoke-RestMethod -Uri $api -Headers $h -ErrorAction Stop
            $payload = @{ message = 'ci: 连接信息'; content = $b64; sha = $ex.sha; branch = 'main' } | ConvertTo-Json -Compress
          } catch {
            $payload = @{ message = 'ci: 连接信息'; content = $b64; branch = 'main' } | ConvertTo-Json -Compress
          }
          try {
            Invoke-RestMethod -Uri $api -Method Put -Headers $h -Body $payload -ContentType 'application/json; charset=utf-8' | Out-Null
            Write-Output 'status.md 已回写'
          } catch {
            Write-Output ('回写失败: ' + $_)
          }

          Write-Output '--- 会话保持中，最长 350 分钟 ---'
          while ($true) {
            Start-Sleep -Seconds 120
            Write-Output ('alive ' + (Get-Date).ToUniversalTime().ToString('HH:mm:ss'))
          }
